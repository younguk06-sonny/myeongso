# 매월 5일 공공데이터포털에서 주차장 정보를 새로 받아 parking/ 폴더를 갱신 (무료, 자동)
name: update-parking
on:
  schedule:
    - cron: '17 18 4 * *'   # 매월 5일 03:17 (한국시간)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/download_parking.mjs /tmp/parking-src.xls
      - run: pip install pandas xlrd && python tools/build_parking.py /tmp/parking-src.xls parking
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add parking
          git diff --cached --quiet && echo "변경 없음" || (git commit -m "주차장 정보 자동 갱신" && git push)
