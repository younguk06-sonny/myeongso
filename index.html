  if (_m === 'dark' || (_m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
}catch(e){}
</script>
<style>
/* 기본: 라이트 (코랄/앰버 포인트) */
:root{
  --bg:#f3f5f8; --bg2:#e9edf2; --card:#ffffff; --card2:#f2f5f9; --ink:#16202a; --sub:#647384; --line:#dde3ea;
  --accent:#ff7a59; --accent2:#ffb347; --accent-ink:#ffffff; --soft:rgba(255,122,89,.12);
  --naver:#03c75a; --kakao:#fee500; --kakao-ink:#191919;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --radius:16px;
}
/* 설정에서 '다크' 선택 시 */
:root[data-theme="dark"]{
  --bg:#10161d; --bg2:#0b1016; --card:#18212b; --card2:#1f2a36; --ink:#edf2f6; --sub:#8a99a8; --line:#2a3644;
  --accent-ink:#1a0f0a; --soft:rgba(255,122,89,.14);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 80%, transparent);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:11px}
header img{width:34px;height:34px;border-radius:10px}
header .ttl{flex:1;min-width:0}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.4px;line-height:1.2;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
header h1 small{font-size:11.5px;font-weight:600;color:var(--sub);letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
header h1 small b{color:var(--accent);font-weight:800}
header .where{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .where b{color:var(--accent);font-weight:700}

/* 반경 */
.radius{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.radius::-webkit-scrollbar{display:none}
.radius span{font-size:12px;color:var(--sub);align-self:center;margin-right:2px;white-space:nowrap}
.rchip{flex:0 0 auto;border:0;background:var(--card2);color:var(--sub);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700}
.rchip.on{background:var(--accent);color:var(--accent-ink)}
.icon-btn{border:0;background:var(--card);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:18px}

.section{padding:4px 16px 14px}
.label{font-size:13px;font-weight:700;color:var(--sub);margin:12px 2px 8px;display:flex;align-items:center;justify-content:space-between}
.label button{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:0}

/* region box */
.region{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
.row{display:flex;gap:8px;align-items:center}
.input{flex:1;min-width:0;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--soft);color:var(--accent);white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:12.5px;color:var(--sub);margin-top:8px;min-height:1em}

/* theme grid */
.cuis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 8px;margin-bottom:4px}
.cu{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;color:var(--ink)}
.cuimg{width:100%;max-width:72px;aspect-ratio:1;border-radius:22px;background:var(--card2);display:grid;place-items:center;
  font-size:clamp(28px,8.5vw,40px);line-height:1;box-shadow:inset 0 -2px 0 rgba(0,0,0,.03);transition:transform .12s}
.cu:active .cuimg{transform:scale(.94)}
.cunm{font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
.cubar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 10px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.cubar .lnk{padding:6px 9px;font-size:12.5px}
.theme .nb{position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:6px;background:#03c75a;color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.nb2{display:inline-block;background:#03c75a;color:#fff;border-radius:5px;font-size:10px;font-weight:900;padding:1px 4px;margin-left:5px;vertical-align:1px;line-height:1.3}
.card.start{padding:16px}
.st-title{font-weight:800;font-size:16px}
.steps{margin:10px 0 14px;padding-left:0;list-style:none;counter-reset:st;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding-left:30px;font-size:14px;line-height:1.5;word-break:keep-all}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;font-size:12.5px;display:grid;place-items:center}
.steps li > b:first-child{margin-right:4px}
.card.nag{background:var(--soft);box-shadow:none;font-size:13.5px}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:85;max-width:616px;margin:0 auto;
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px;font-weight:700}
.updbar span{flex:1}
.updbar .x{border:0;background:none;color:var(--bg);font-size:16px;opacity:.7}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:800}
.cat.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat .n{font-weight:600;opacity:.7;margin-left:3px;font-size:12px}
.ghead{grid-column:1 / -1;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;margin:8px 2px -2px}
.ghead small{font-weight:600;color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.theme{--c:var(--accent);position:relative;border:0;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;overflow:hidden}
.theme::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c);opacity:.85}
.theme .em{font-size:24px;line-height:1;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:color-mix(in srgb, var(--c) 20%, transparent)}
.theme:active{transform:scale(.97)}
.theme.add::after{display:none}
.theme.add .em{background:none}
.theme .nm{font-size:13px;font-weight:700;text-align:center;word-break:keep-all;line-height:1.3}
.theme.add{border:1.5px dashed var(--line);background:transparent;box-shadow:none;color:var(--sub)}
.theme .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;
  background:var(--ink);color:var(--bg);font-size:12px;line-height:22px;padding:0;display:none}
.editing .theme .del{display:block}
.editing .theme:not(.add){animation:wig .3s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}

/* cards / lists */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.place h3{margin:0 0 2px;font-size:16px;letter-spacing:-.2px}
.meta{font-size:12.5px;color:var(--sub)}
.memo{font-size:13.5px;margin-top:6px;background:var(--bg);border-radius:10px;padding:7px 10px;white-space:pre-wrap}
.badge{--c:var(--accent);display:inline-block;font-size:11.5px;font-weight:700;background:color-mix(in srgb, var(--c) 18%, transparent);color:var(--c);border-radius:999px;padding:2px 8px;margin-right:4px}
.card.place{border-left:3px solid var(--c,transparent)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lnk{display:inline-flex;align-items:center;gap:4px;text-decoration:none;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;border:0}
.lnk.naver{background:var(--naver);color:#fff}
.lnk.kakao{background:var(--kakao);color:var(--kakao-ink)}
.lnk.plain{background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--sub);padding:36px 12px;font-size:14px}
.empty .big{font-size:40px}

/* dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--sub);font-weight:700}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:700;color:var(--sub);margin-left:2px}
.kpi .s{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.hero{grid-column:1 / -1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 22px rgba(255,122,89,.28)}
.kpi.hero .k,.kpi.hero .s{color:rgba(255,255,255,.88)}
.prog{height:8px;border-radius:8px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:#fff;border-radius:8px}
.bars .bar{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.bars .bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.bars .track{height:10px;background:var(--card2);border-radius:10px;overflow:hidden}
.bars .track i{display:block;height:100%;border-radius:10px;background:var(--c)}
.bars .bar .cnt{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none}
.mini:first-child{border-top:0}
.mini .dot{flex:0 0 34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.mini .tx{flex:1;min-width:0}
.mini .tx b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tx span{font-size:12px;color:var(--sub)}
.mini .d{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.qchip{--c:var(--accent);flex:0 0 auto;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:9px 12px;
  font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;border-bottom:3px solid var(--c)}
.lnk.done{background:color-mix(in srgb,#34d399 20%,transparent);color:#0f9f6e}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;font-size:11.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button .ti{font-size:21px}
nav.tabs button.on{color:var(--accent);font-weight:800}
.view{display:none}.view.on{display:block}

/* map */
.dmap{position:relative;margin-bottom:10px}
#dashMap{position:relative;z-index:0;width:100%;height:230px;border-radius:var(--radius);overflow:hidden;background:var(--card2);box-shadow:var(--shadow)}
.dmap .open{position:absolute;left:10px;bottom:10px;z-index:5;border:0;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:800;
  background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.dmap .cap{position:absolute;left:10px;top:10px;z-index:5;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;
  background:var(--card);color:var(--sub);box-shadow:0 2px 8px rgba(0,0,0,.12);pointer-events:none}
#map{position:relative;z-index:0;width:100%;height:52vh;min-height:300px;border-radius:var(--radius);overflow:hidden;background:var(--card2)}
.mapbox{position:relative}
.mapfab{position:absolute;right:10px;bottom:10px;z-index:5;width:42px;height:42px;border:0;border-radius:12px;background:var(--card);color:var(--ink);
  box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:20px;line-height:1}
.mapbadge{position:absolute;left:10px;top:10px;z-index:5;background:var(--card);color:var(--sub);font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 8px;box-shadow:0 1px 6px rgba(0,0,0,.15);pointer-events:none}
.mapbadge:empty{display:none}
.seg.prov button{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px}
.pl{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900}
.pl.n{background:var(--naver);color:#fff}.pl.k{background:var(--kakao);color:var(--kakao-ink)}
.mapnote{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}
.mapnote button{border:0;background:none;color:var(--accent);font-weight:800;padding:0;margin-left:4px;text-decoration:underline}
.mapempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:13.5px;padding:20px}
.mk{background:var(--c,var(--accent));color:#10161d;font-weight:800;font-size:12px;border-radius:999px;min-width:26px;height:26px;
  padding:0 7px;display:grid;place-items:center;border:2px solid #10161d;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.mk.saved{border-color:#fff}
.mk.pk{--c:#2563eb;color:#fff;border-color:#fff;border-radius:8px;height:24px;min-width:24px;padding:0 6px;font-size:11px;white-space:nowrap}
.mk.pk.free{--c:#16a34a}
.pkc{border-left:3px solid #2563eb}
.pkc.free{border-left-color:#16a34a}
.pkc .top{display:flex;align-items:flex-start;gap:8px}
.pkc .top h3{flex:1;min-width:0;margin:0;font-size:15.5px}
.pkc .dist{font-weight:800;color:var(--accent);font-size:13px;white-space:nowrap}
.pkfee{margin:6px 0 2px;font-size:13px;color:var(--sub)}
.pkfee b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:2px}
.pkfee .free{color:#16a34a;font-size:16px}
.pkfee .unk{color:var(--sub);font-size:14px}
.mk.me{background:#4da3ff;min-width:16px;height:16px;padding:0;border:3px solid #fff;box-shadow:0 0 0 6px rgba(77,163,255,.25)}

/* sheet */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:none}
.dim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:640px;margin:0 auto;background:var(--card);
  border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .22s ease;max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 4px}
.sheet .q{font-size:13px;color:var(--sub);margin-bottom:12px}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigbtns .lnk{justify-content:center;padding:14px 8px;font-size:14.5px;border-radius:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field .input{width:100%}
textarea.input{min-height:70px;resize:vertical}
select.input{appearance:none}
.hint{font-size:12.5px;color:var(--sub);line-height:1.55}
/* 별점·후기·사진 */
.stars{display:inline-flex;gap:1px;line-height:1;vertical-align:-1px;font-size:15px}
.st{position:relative;display:inline-block;color:var(--line)}
.st i{position:absolute;left:0;top:0;bottom:0;overflow:hidden;color:#ffb400;font-style:normal;white-space:nowrap}
.rate{display:flex;align-items:center;gap:10px}
.rate .stars{font-size:40px;gap:4px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
.rate .num{font-size:22px;font-weight:800;min-width:46px;font-variant-numeric:tabular-nums}
.review{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--card2)}
.review .top{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
.review .top b{color:var(--ink);font-size:14px}
.review p{margin:5px 0 0;font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.thumbs .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line);border:0;padding:0;max-width:100%}
.thumbs .ph img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .ph .more{position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px}
.thumbs .ph .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:grid;place-items:center}
.thumbs .addph{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--line);background:transparent;color:var(--sub);font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.thumbs .addph span{font-size:22px}
.viewer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:82vh;object-fit:contain}
.viewer .bar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:#fff;font-weight:700}
.viewer button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;width:42px;height:42px;font-size:18px}
.viewer .nav{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;gap:16px}
.exitdlg{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px}
.exitdlg.on{display:flex}
.exbox{width:100%;max-width:300px;background:var(--card);border-radius:20px;padding:22px 18px 16px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.exicon{width:52px;height:52px;border-radius:14px}
.extitle{font-size:17px;font-weight:800;margin:10px 0 16px}
.exbtns{display:flex;gap:8px}
.exbtns .btn{flex:1;padding:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
</style>
</head>
<body>
<div class="app">
  <header>

        <div class="radius" data-radius><span>반경</span></div>

      </div>
    </div>
  </main>

  <!-- ② 지도 -->
  <main class="view" id="v-map">
    <div class="section">
      <div class="mapnote" id="mapNote" hidden></div>
      <div class="row" style="margin:10px 0">
        <input class="input" id="mapQ" placeholder="장소·키워드 검색 (예: 칼국수, 복권판매점)" autocomplete="off">

      </div>
      <div class="radius" data-radius style="margin:0 0 10px"><span>반경</span></div>
      <div class="mapbox">
        <div id="map"></div>

      <div style="text-align:center"><button class="btn ghost" id="btnMore" style="display:none">결과 더 보기</button></div>

  {id:'jpn',   em:'🍣', name:'일식',       kw:'일식',       tok:['일식']},
  {id:'wst',   em:'🍝', name:'양식',       kw:'양식',       tok:['양식']},
  {id:'snack', em:'🍢', name:'분식',       kw:'분식',       tok:['분식']},
  {id:'chk',   em:'🍗', name:'치킨',       kw:'치킨',       tok:['치킨']},
  {id:'pizza', em:'🍕', name:'피자',       kw:'피자',       tok:['피자']},
  {id:'fast',  em:'🍔', name:'패스트푸드', kw:'패스트푸드', tok:['패스트푸드','햄버거']},
  {id:'meat',  em:'🥩', name:'고기·구이',  kw:'고기집',     tok:['육류,고기','곱창,막창','삼겹살','갈비']},
  {id:'sea',   em:'🦀', name:'회·해산물',  kw:'횟집',       tok:['해물,생선','회','조개','게,대게']},
  {id:'soup',  em:'🍲', name:'국밥·찌개',  kw:'국밥',       tok:['국밥','찌개,전골','해장국','설렁탕','감자탕','곰탕']},
  {id:'asia',  em:'🍛', name:'아시안',     kw:'아시아음식', tok:['아시아음식','베트남','태국','인도']},
  {id:'bar',   em:'🍺', name:'술집',       kw:'술집',       tok:['술집']},

  {id:'dsrt',  em:'🍰', name:'디저트',     kw:'디저트 카페',     tok:['디저트카페','제과,베이커리','아이스크림','떡,한과','도넛']}
];
function cuisineGrid(limit){
  const list = limit ? CUISINES.slice(0, limit) : CUISINES;
  return `<div class="cuis">${list.map(c => `<button class="cu" data-cu="${c.id}"><span class="cuimg">${c.em}</span><span class="cunm">${c.name}</span></button>`).join('')}</div>`;
}
// 음식 종류를 누르면 → 지도 탭에서 내 주변(또는 입력한 지역) 그 종류 가게를 바로 검색
// 지도 탭에서 바로 검색 (음식 종류·앱 지도에서 볼 수 있는 테마·직접 검색 모두 같은 방식)
// o: {em, name, q(앱 지도 검색어), mapQ(카카오·네이버 검색어), webQ(후기 검색어), themeId, cuisine, note, extra}
async function openOnMap(o){
  const area = useMyLoc ? '' : currentArea();
  if (area) rememberRegion(area);
  closeSheet(); showTab('map'); await MapView.init(); if (!MapView.map) return;
  if (!area && myPos) MapView.eng.setCenter(MapView.map, myPos);
  const pre = area ? area + ' ' : '';
  $('#mapQ').value = pre + o.q;
  MapView.cuisine = o.cuisine || null;
  const bar = $('#mapCuisineBar');
  bar.hidden = false;
  bar.innerHTML = `<b>${esc(o.em)} ${esc(o.name)}</b> <span class="meta">${esc(area || myArea || '내 주변')}</span>
    <span style="flex:1"></span>
    <a class="lnk kakao" href="${esc(Links.kakaoSearch(pre + (o.mapQ || o.q), area ? null : myPos))}" target="_blank" rel="noopener">카카오맵</a>
    <a class="lnk naver" href="${esc(Links.naverSearch(pre + (o.mapQ || o.q)))}" target="_blank" rel="noopener">네이버</a>
    <a class="lnk plain" href="${esc(Links.naverBlog(pre + (o.webQ || o.q)))}" target="_blank" rel="noopener">후기</a>
    ${(o.extra || []).map(x => `<a class="lnk plain" href="${esc(x.url)}" target="_blank" rel="noopener">🔗 ${esc(x.label)}</a>`).join('')}
    ${o.note ? `<div class="hint" style="flex-basis:100%;margin-top:2px">ℹ️ ${esc(o.note)}</div>` : ''}`;
  MapView.search(o.themeId || '');
}
function openCuisine(id){
  const cu = CUISINES.find(c => c.id === id); if (!cu) return;
  openOnMap({em: cu.em, name: cu.name, q: cu.kw, mapQ: cu.kw, webQ: cu.name + ' 맛집', cuisine: cu});
}
document.addEventListener('click', e => { const b = e.target.closest('[data-cu]'); if (b) openCuisine(b.dataset.cu); });

// 대분류
const CATS = [
  {id:'food', em:'📺', name:'방송 맛집'}, {id:'bakery', em:'🥐', name:'빵집'}, {id:'cafe', em:'☕', name:'카페'},
  {id:'dessert', em:'🍰', name:'디저트'}, {id:'etc', em:'📍', name:'기타'}
];
// 이 앱 지도에서 결과를 볼 수 있는 테마인지 (카카오가 방송 정보를 못 찾는 방송 테마만 false)
function inAppOK(t){ return !(t.tv && !t.kakao); }
// [테마, 원래 순서] 목록을 '앱 지도에서 볼 수 있는 것 먼저'로 정렬 (같은 그룹 안에서는 원래 순서 유지)
function byInApp(pairs){ return pairs.slice().sort((a, b) => (inAppOK(a[0]) ? 0 : 1) - (inAppOK(b[0]) ? 0 : 1) || a[1] - b[1]); }
function catOf(t){
  if (t.cat && CATS.some(c => c.id === t.cat)) return t.cat;
  const d = DEFAULT_THEMES.find(x => x.id === t.id); if (d && d.cat) return d.cat;
  return t.tv ? 'food' : 'etc';
}

// ---------- 저장소 ----------
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('ms_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('ms_'+k, JSON.stringify(v)); }catch(e){ toast('저장 공간에 쓸 수 없어요'); } }
};
let themes   = LS.get('themes', null) || DEFAULT_THEMES.slice();
if ((LS.get('themesVer', 1)) < THEME_VER){
  const prevVer = LS.get('themesVer', 1);
  themes = themes.map(t => { const d = DEFAULT_THEMES.find(x => x.id === t.id);
    return d ? Object.assign({}, t, {cat:t.cat || d.cat, special:d.special, tv:d.tv, kakao:d.kakao, kw:d.kw, web:d.web, mapQ:d.mapQ, mapKw:d.mapKw, exclude:d.exclude, note:d.note, extra:d.extra}) : t; });
  // v3에서 새로 생긴 기본 테마(백반기행·생생정보·맛있는녀석들)를 한 번만 추가
  if (prevVer < 3){ let at = themes.findIndex(t => t.id === 'dal'); at = at >= 0 ? at + 1 : themes.length;
    ['bbg','ssj','mnj'].forEach(id => { if (!themes.some(t => t.id === id)){
      themes.splice(at++, 0, Object.assign({}, DEFAULT_THEMES.find(x => x.id === id))); } }); }
  // v4: 빵집·카페·디저트·기타 대분류용 새 테마를 한 번만 추가
  if (prevVer < 4) ['salt','bagel','sikbbang','mood','bigcafe','brunch','dcafe','cake','macaron','bingsu','tteok','market','camp','kids'].forEach(id => {
    if (!themes.some(t => t.id === id)) themes.push(Object.assign({}, DEFAULT_THEMES.find(x => x.id === id))); });
  if (prevVer < 5 && !themes.some(t => t.id === 'parking')){
    const at = themes.findIndex(t => t.id === 'lotto');
    themes.splice(at >= 0 ? at + 1 : themes.length, 0, Object.assign({}, DEFAULT_THEMES.find(x => x.id === 'parking')));
  }
  if (LS.get('themes', null)) LS.set('themes', themes);
  LS.set('themesVer', THEME_VER);
}
let places   = LS.get('places', []);          // 저장한 장소
let recents  = LS.get('recents', []);         // 최근 지역
// 앱에 기본으로 들어 있는 카카오 JavaScript 키 (https://younguk06-sonny.github.io 에서만 동작)
// 설정에서 다른 키를 넣으면 그 키를 우선 사용
const APP_VER = '2026.11.06-14';   // 고칠 때마다 올림 (설정 화면 맨 아래에 표시)
const BUILTIN_KAKAO_KEY = '76e1f2c0c1f996041b2d1c9441792ea1';
function kakaoKey(){ return settings.kakaoKey || BUILTIN_KAKAO_KEY; }
let settings = Object.assign({kakaoKey:'', openMode:'web', radius:3000, mode:'light'}, LS.get('settings', {}));
delete settings.naverKey; delete settings.mapProvider;   // 네이버 지도 화면 기능은 요금 문제로 제거
const RADII = [[500,'500m'],[1000,'1km'],[3000,'3km'],[5000,'5km'],[10000,'10km'],[20000,'20km']];
function applyMode(){
  const dark = settings.mode === 'dark' || (settings.mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : '';
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#10161d' : '#f3f5f8');
}
applyMode();
function themeColor(t){
  if (!t) return '#8a99a8';
  return t.c || (DEFAULT_THEMES.find(d => d.id === t.id) || {}).c || '#ff7a59';
}
let myPos    = null;   // {lat,lng}
let myArea   = '';     // 내 위치를 동 이름으로 바꾼 값 (카카오 키 있을 때)
let useMyLoc = false;  // 지역 대신 내 위치 사용 중

const $  = s => document.querySelector(s);
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 1800);
}

// ---------- 지도 링크 만들기 ----------
const APPNAME = location.hostname || 'myeongso';
const Links = {
  naverSearch(q){
    if (settings.openMode === 'app' && isMobile) return `nmap://search?query=${enc(q)}&appname=${enc(APPNAME)}`;
    return `https://map.naver.com/p/search/${enc(q)}`;
  },
  kakaoSearch(q, pos){
    if (settings.openMode === 'app' && isMobile)
      return `kakaomap://search?q=${enc(q)}` + (pos ? `&p=${pos.lat},${pos.lng}` : '');
    return `https://map.kakao.com/link/search/${enc(q)}`;
  },
  naverWeb(q){ return `https://search.naver.com/search.naver?query=${enc(q)}`; },
  naverBlog(q){ return `https://search.naver.com/search.naver?where=blog&query=${enc(q)}`; },
  youtube(q){ return `https://www.youtube.com/results?search_query=${enc(q)}`; },
  // 특정 장소
  kakaoPlace(p){
    if (p.kakaoUrl) return p.kakaoUrl;
    if (p.lat) return `https://map.kakao.com/link/map/${enc(p.name)},${p.lat},${p.lng}`;
    return Links.kakaoSearch(placeQuery(p));
  },
  kakaoRoute(p){ return `https://map.kakao.com/link/to/${enc(p.name)},${p.lat},${p.lng}`; },
  naverRoute(p){
    if (isMobile) return `nmap://route/public?dlat=${p.lat}&dlng=${p.lng}&dname=${enc(p.name)}&appname=${enc(APPNAME)}`;
    return Links.naverSearch(placeQuery(p));
  }
};
function placeQuery(p){
  // "가게이름 + 동 이름" 정도로 검색해야 동명 가게와 헷갈리지 않음
  const area = (p.address || p.region || '').split(' ').slice(1,3).join(' ');
  return (p.name + ' ' + area).trim();
}

// ---------- 지역/내 위치 ----------
function currentArea(){
  if (useMyLoc) return myArea || '';
  return $('#region').value.trim();
}
function renderRadius(){
  document.querySelectorAll('[data-radius]').forEach(box => {
    box.innerHTML = '<span>반경</span>' + RADII.map(([m,l]) =>
      `<button class="rchip ${settings.radius===m?'on':''}" data-m="${m}">${l}</button>`).join('');
  });
}
document.addEventListener('click', e => {
  const b = e.target.closest('.rchip'); if (!b) return;
  settings.radius = +b.dataset.m; LS.set('settings', settings); renderRadius(); updateWhere(); if ($('#v-dash').classList.contains('on')) renderDash();
  if (MapView.map){ MapView.drawMe(); if ($('#mapQ').value.trim() && kakaoKey()) MapView.search(MapView.themeId); }
});
function updateWhere(){
  const w = $('#where'); if (!w) return;
  const r = (RADII.find(x => x[0] === settings.radius) || [0,''])[1];
  if (useMyLoc) w.innerHTML = `📍 <b>${esc(myArea || '현재 위치')}</b> 기준 · 반경 ${r}`;
  else if ($('#region').value.trim()) w.innerHTML = `🔎 <b>${esc($('#region').value.trim())}</b> 에서 찾는 중`;
  else w.textContent = myPos ? '지역을 입력하거나 내 위치를 눌러 주세요' : '위치 확인 중…';
}
function renderRegionChips(){
  renderRadius(); updateWhere();
  const box = $('#regionChips');
  const chips = [];
  if (myPos) chips.push(`<button class="chip ${useMyLoc?'on':''}" data-me="1">📍 ${esc(myArea || '내 주변')}</button>`);
  recents.forEach(r => chips.push(`<button class="chip ${!useMyLoc && $('#region').value.trim()===r?'on':''}" data-r="${esc(r)}">${esc(r)}</button>`));
  box.innerHTML = chips.join('');
}
$('#regionChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.me){ useMyLoc = true; $('#region').value=''; }
  else { useMyLoc = false; $('#region').value = b.dataset.r; }
  renderRegionChips();
});
$('#region').addEventListener('input', () => { useMyLoc = false; renderRegionChips(); });

function rememberRegion(r){
  if (!r) return;
  recents = [r, ...recents.filter(x => x !== r)].slice(0, 6);
  LS.set('recents', recents); renderRegionChips();
}

function locate(){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('이 브라우저는 위치를 지원하지 않아요'));
    navigator.geolocation.getCurrentPosition(
      p => { myPos = {lat:p.coords.latitude, lng:p.coords.longitude}; resolve(myPos); },
      err => reject(new Error(err.code === 1 ? '위치 권한이 꺼져 있어요 (브라우저 설정에서 허용)' : '위치를 가져오지 못했어요')),
      {enableHighAccuracy:true, timeout:10000, maximumAge:60000}
    );
  });
}
// 내 위치 잡기 — 앱을 열 때 자동으로 한 번, 버튼으로 언제든 다시
async function useCurrentLocation(auto){
  const st = $('#locStatus');
  st.textContent = auto ? '📍 내 위치를 찾는 중…' : '위치 확인 중…';
  try{
    await locate();
    // 위치를 찾는 동안 사용자가 지역을 직접 입력했다면 그 지역을 우선
    if (auto && $('#region').value.trim()){ st.textContent = ''; renderRegionChips(); return; }
    useMyLoc = true; $('#region').value = '';
    myArea = '';
    if (await Kakao.ready()) myArea = await Kakao.areaName(myPos);
    st.textContent = '';   // 위치 표시는 상단 제목 아래에서 보여줌
    renderRegionChips();
    if (MapView.map){ MapView.eng.setCenter(MapView.map, myPos); MapView.drawMe(); }
    if ($('#savedSort').value === 'dist') renderSaved();
    if ($('#v-dash').classList.contains('on')) renderDash();
  }catch(e){
    st.textContent = auto ? `${e.message} — 지역을 직접 입력해도 돼요` : e.message;
  }
}
$('#btnLoc').addEventListener('click', () => useCurrentLocation(false));

// ---------- 테마 ----------
let editing = false;
let findCat = LS.get('findCat', 'all');
function catChips(sel, attr){
  const n = id => themes.filter(t => catOf(t) === id).length;
  return [`<button class="cat ${sel==='all'?'on':''}" ${attr}="all">전체</button>`]
    .concat(CATS.map(c => `<button class="cat ${sel===c.id?'on':''}" ${attr}="${c.id}">${c.em} ${c.name}<span class="n">${n(c.id)}</span></button>`)).join('');
}
function renderThemes(){
  const g = $('#themeGrid');
  g.classList.toggle('editing', editing);
  $('#findCats').innerHTML = catChips(findCat, 'data-fc');
  const tile = (t,i) => `
    <button class="theme" data-i="${i}" style="--c:${esc(themeColor(t))}">
      <span class="del" data-del="${i}">✕</span>${inAppOK(t) ? '' : '<span class="nb" title="네이버 검색으로 연결">N</span>'}
      <span class="em">${esc(t.em)}</span><span class="nm">${esc(t.name)}</span>
    </button>`;
  const groups = CATS.filter(c => findCat === 'all' || findCat === c.id).map(c => {
    const items = byInApp(themes.map((t,i) => [t,i]).filter(([t]) => catOf(t) === c.id));
    if (!items.length && findCat === 'all') return '';
    return `<div class="ghead">${c.em} ${c.name} <small>${items.length}</small></div>` +
      (items.length ? items.map(([t,i]) => tile(t,i)).join('') : `<div class="hint" style="grid-column:1/-1">아직 테마가 없어요. ‘테마 추가’로 만들어 보세요.</div>`);
  }).join('');
  g.innerHTML = groups + `<button class="theme add" id="btnAddTheme"><span class="em">＋</span><span class="nm">테마 추가</span></button>`;
  $('#btnEditThemes').textContent = editing ? '완료' : '편집';
}
$('#findCats').addEventListener('click', e => { const b = e.target.closest('[data-fc]'); if (!b) return;
  findCat = b.dataset.fc; LS.set('findCat', findCat); renderThemes(); });
$('#btnEditThemes').addEventListener('click', () => { editing = !editing; renderThemes(); });
$('#themeGrid').addEventListener('click', e => {
  if (e.target.closest('#btnAddTheme')) return openThemeForm(null, findCat !== 'all' ? findCat : undefined);
  const del = e.target.closest('[data-del]');
  if (del){
    const t = themes[+del.dataset.del];
    if (confirm(`'${t.name}' 테마를 지울까요? (저장한 장소는 남아 있어요)`)){
      themes.splice(+del.dataset.del, 1); LS.set('themes', themes); renderThemes(); renderSaved();
    }
    return;
  }
  const b = e.target.closest('.theme'); if (!b) return;
  if (editing) return openThemeForm(+b.dataset.i);
  openSearchSheet(themes[+b.dataset.i]);
});

function openThemeForm(i, presetCat){
  const t = i != null ? themes[i] : {em:'📍', name:'', kw:'', mapKw:'', cat: presetCat || 'food'};
  const cur = catOf(t);
  openSheet(`
    <h2>${i != null ? '테마 수정' : '새 테마 추가'}</h2>
    <p class="q">예: "허영만 백반기행", "성시경 먹을텐데", "생생정보", "캠핑장" 처럼 자주 찾는 주제를 만들어 두세요.</p>
    <div class="row field">
      <div style="flex:0 0 72px"><label>아이콘</label><input class="input" id="tEm" value="${esc(t.em)}" maxlength="4" style="text-align:center;font-size:22px"></div>
      <div style="flex:1"><label>이름</label><input class="input" id="tName" value="${esc(t.name)}" placeholder="백반기행"></div>
      <div style="flex:0 0 56px"><label>색</label><input type="color" id="tC" value="${esc(themeColor(t.id ? t : null) === '#8a99a8' ? '#ff7a59' : themeColor(t))}" style="width:56px;height:46px;border:0;background:none;padding:0"></div>
    </div>
    <div class="field"><label>대분류</label>
      <div class="cats" id="tCat" style="margin:0">${CATS.map(c => `<button type="button" class="cat ${cur===c.id?'on':''}" data-tc="${c.id}">${c.em} ${c.name}</button>`).join('')}</div></div>
    <div class="field"><label>검색 키워드 (지역 뒤에 붙어요)</label>

// ---------- 사진 저장소 (IndexedDB: 사진은 용량이 커서 따로 보관) ----------
const PhotoDB = {
  _db: null, cache: {},
  open(){
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('myeongso', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos');
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode), st = t.objectStore('photos');
      const out = fn(st);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  async get(id){ if (this.cache[id]) return this.cache[id];
    const v = await this.tx('readonly', st => st.get(id)); if (v) this.cache[id] = v; return v; },
  put(id, data){ this.cache[id] = data; return this.tx('readwrite', st => st.put(data, id)); },
  del(id){ delete this.cache[id]; return this.tx('readwrite', st => st.delete(id)); }
};
// 사진을 긴 변 1280px JPEG로 줄여서 저장 (폰 사진 5MB → 약 200KB)
async function shrinkImage(file, max = 1280, q = 0.8){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

function starsHTML(r){
  let h = '';
  for (let i = 0; i < 5; i++){ const f = Math.max(0, Math.min(1, (r || 0) - i)) * 100;
    h += `<span class="st" data-i="${i}">★<i style="width:${f}%">★</i></span>`; }
  return `<span class="stars">${h}</span>`;
}
const fmtRate = r => (r || 0).toFixed(1);
const fmtDay = t => t ? new Date(t).toLocaleDateString('ko-KR', {year:'2-digit', month:'numeric', day:'numeric'}) : '';

// ---------- 저장한 장소 ----------
let savedFilter = 'all';
function themeOf(id){ return themes.find(t => t.id === id); }
function distKm(a, b){
  const R = 6371, d2r = Math.PI/180;
  const dLat = (b.lat-a.lat)*d2r, dLng = (b.lng-a.lng)*d2r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*d2r)*Math.cos(b.lat*d2r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmtDist(km){ return km < 1 ? Math.round(km*1000)+'m' : km.toFixed(1)+'km'; }

function placeCard(p, opts = {}){

    ${p.visited && (p.rating || p.review || (p.photos||[]).length) ? `<div class="review">

      ${p.review ? `<p>${esc(p.review)}</p>` : ''}
      ${(p.photos||[]).length ? `<div class="thumbs">${p.photos.slice(0,4).map((id,i) =>
        `<button class="ph" data-view="${esc(p.id)}" data-vi="${i}"><img data-ph="${esc(id)}" alt="">${i===3 && p.photos.length>4 ? `<span class="more">+${p.photos.length-4}</span>` : ''}</button>`).join('')}</div>` : ''}
    </div>` : ''}
    <div class="actions">
      <a class="lnk naver" href="${esc(Links.naverSearch(placeQuery(p)))}" target="_blank" rel="noopener">네이버</a>
      <a class="lnk kakao" href="${esc(Links.kakaoPlace(p))}" target="_blank" rel="noopener">카카오</a>
      ${p.lat ? `<a class="lnk plain" href="${esc(Links.kakaoRoute(p))}" target="_blank" rel="noopener">🚗 길찾기</a>` : ''}
      <button class="lnk ${p.visited ? 'done' : 'plain'}" data-visit="${esc(p.id)}">${p.visited ? '✅ 가봤어요' : '☐ 가봤어요'}</button>
      ${p.visited && !opts.noEdit ? `<button class="lnk plain" data-review="${esc(p.id)}">${p.rating || p.review || (p.photos||[]).length ? '✍️ 후기 수정' : '✍️ 후기 쓰기'}</button>` : ''}
      ${opts.noEdit ? '' : `<button class="lnk plain" data-edit="${esc(p.id)}">수정</button><button class="lnk plain" data-rm="${esc(p.id)}">삭제</button>`}
    </div></div>`;
}

  else if (sort === 'dist' && myPos) list.sort((a,b) => (a.lat ? distKm(myPos,a) : 9e9) - (b.lat ? distKm(myPos,b) : 9e9));

    <div class="field"><label>별점 (0.5점 단위 · 별 왼쪽 절반을 누르면 반 개)</label>

        <button class="btn small ghost" id="rClear" style="margin-left:auto">지우기</button></div></div>
    <div class="field"><label>방문한 날</label>

    <div class="field"><label>사진 <span id="rPhCount" style="font-weight:400"></span></label>

      <div class="hint" style="margin-top:6px">사진은 자동으로 줄여서 이 휴대폰에 저장돼요 (최대 12장).</div></div>
    <button class="btn primary" id="rSave" style="width:100%">후기 저장</button>
  `);
  const drawStars = () => {
    $('#rStars').innerHTML = starsHTML(rating);
    $('#rNum').textContent = rating ? fmtRate(rating) : '–';
  };
  const pick = ev => {
    const st = ev.target.closest('.st'); if (!st) return;
    const r = st.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    rating = +st.dataset.i + (x < r.width / 2 ? 0.5 : 1);
    drawStars();
  };
  drawStars();
  $('#rStars').addEventListener('click', pick);
  // 손가락으로 쓸어서 고르기
  $('#rStars').addEventListener('touchmove', ev => {
    const t = ev.touches[0]; const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.closest('#rStars')) pick({target: el, touches: ev.touches}); ev.preventDefault();
  }, {passive:false});
  $('#rClear').onclick = () => { rating = 0; drawStars(); };

  const drawPhotos = () => {
    $('#rPhCount').textContent = photos.length ? `(${photos.length}/12)` : '';
    $('#rPhotos').innerHTML = photos.map((id,i) =>
      `<div class="ph"><img data-ph="${esc(id)}" alt=""><button class="x" data-rmph="${i}" aria-label="사진 빼기">✕</button></div>`).join('') +
      (photos.length < 12 ? `<button class="addph" id="rAdd"><span>📷</span>사진 추가</button>` : '');
    fillPhotos($('#rPhotos'));
  };
  drawPhotos();
  $('#rPhotos').onclick = ev => {
    if (ev.target.closest('#rAdd')) return $('#rFile').click();
    const x = ev.target.closest('[data-rmph]');
    if (x){ removed.push(photos[+x.dataset.rmph]); photos.splice(+x.dataset.rmph, 1); drawPhotos(); }
  };
  $('#rFile').onchange = async ev => {
    const files = [...ev.target.files].slice(0, 12 - photos.length); ev.target.value = '';
    if (!files.length) return;
    toast(`사진 ${files.length}장 넣는 중…`);
    for (const f of files){
      try{
        const data = await shrinkImage(f); const id = 'ph_' + uid();
        await PhotoDB.put(id, data); photos.push(id); added.push(id); drawPhotos();
      }catch(err){ toast('읽을 수 없는 사진이 있어요'); }
    }
  };
  $('#rSave').onclick = () => {
    p.rating = rating || 0; p.visitDate = $('#rDate').value; p.review = $('#rText').value.trim();
    p.photos = photos; p.visited = true; p.visitedAt = p.visitedAt || Date.now();
    removed.forEach(id => PhotoDB.del(id).catch(()=>{}));
    LS.set('places', places); saved = true; closeSheet(); renderSaved();
    if ($('#v-dash').classList.contains('on')) renderDash();
    toast('📝 후기를 저장했어요');
  };
  // 저장하지 않고 닫으면 새로 넣은 사진은 정리
  let saved = false;
  const cleanup = () => { if (!saved) added.forEach(id => PhotoDB.del(id).catch(()=>{})); $('#dim').removeEventListener('click', cleanup); };
  $('#dim').addEventListener('click', cleanup);
}

// 장소 추가/수정 폼. prefill: 카카오 검색결과 등

  const canLookup = !!kakaoKey() && !existing && (!prefill || prefill.lookup);

    <h2>${existing ? '장소 수정' : '장소 저장'}</h2>
    <div class="field"><label>가게·장소 이름</label>
      <div class="row"><input class="input" id="pName" value="${esc(p.name)}" placeholder="예: ○○칼국수">
      ${canLookup ? `<button class="btn" id="pLookup">위치 찾기</button>` : ''}</div>
      <div id="pLookupRes"></div></div>
    <div class="field"><label>주소 또는 지역</label>
      <input class="input" id="pAddr" value="${esc(p.address || p.region || '')}" placeholder="예: 부천시 원미구 중동"></div>
    <div class="field"><label>테마</label><select class="input" id="pTheme">${themeOptions(p.theme)}</select></div>
    <div class="field"><label>메모</label>
      <textarea class="input" id="pMemo" placeholder="예: 2024.3 전현무계획 방송, 칼국수+수육 추천, 주차 어려움">${esc(p.memo)}</textarea></div>
    <div class="hint" id="pCoord" style="margin:-4px 0 10px">${p.lat ? '📍 지도 위치가 저장돼요' : (kakaoKey() ? '‘위치 찾기’를 누르면 지도 위치까지 저장돼요 (길찾기·거리순 정렬 가능)' : '이름+지역으로 지도에서 검색해 열어줘요')}</div>
    <button class="btn primary" id="pSave" style="width:100%">저장</button>
  `);
  let coord = p.lat ? {lat:p.lat, lng:p.lng, kakaoUrl:p.kakaoUrl, phone:p.phone, category:p.category} : null;
  const lk = $('#pLookup');
  if (lk) lk.onclick = async () => {
    const name = $('#pName').value.trim(); if (!name) return toast('이름을 먼저 입력하세요');
    if (!await Kakao.ready()) return toast('카카오 키를 확인하세요');
    const area = $('#pAddr').value.trim();
    let res = await Kakao.keyword((area ? area.split(' ').slice(0,2).join(' ')+' ' : '') + name, {size:5});
    if (!res.length && area) res = await Kakao.keyword(name, {size:5});   // 다른 지역 가게일 수 있어서 전국에서 다시
    const box = $('#pLookupRes');
    if (!res.length){ box.innerHTML = `<div class="hint" style="margin-top:6px">검색 결과가 없어요. 이름을 조금 바꿔 보세요.</div>`; return; }
    box.innerHTML = res.map((r,i) => `<button class="card" data-pick="${i}" style="display:block;width:100%;text-align:left;margin:6px 0 0;padding:10px;border:1.5px solid var(--line)">
      <b>${esc(r.place_name)}</b><div class="meta">${esc(r.road_address_name || r.address_name)} · ${esc(r.category_group_name || r.category_name.split(' > ').pop())}</div></button>`).join('');
    box.onclick = ev => {
      const b = ev.target.closest('[data-pick]'); if (!b) return;
      const r = res[+b.dataset.pick];
      $('#pName').value = r.place_name; $('#pAddr').value = r.road_address_name || r.address_name;
      coord = {lat:+r.y, lng:+r.x, kakaoUrl:r.place_url, phone:r.phone, category:r.category_name.split(' > ').pop()};
      box.innerHTML = ''; $('#pCoord').textContent = '📍 위치를 찾았어요. 저장하면 지도에 표시돼요.';
    };
  };
  if (lk && prefill && prefill.lookup) lk.click();   // 이름을 넣고 왔으면 바로 위치 찾기
  $('#pSave').onclick = () => {
    const name = $('#pName').value.trim(); if (!name) return toast('이름을 입력하세요');
    const addr = $('#pAddr').value.trim();
    const np = Object.assign(existing || {id:uid(), savedAt:Date.now()}, {
      name, theme: $('#pTheme').value, memo: $('#pMemo').value.trim(),
      address: coord ? addr : '', region: coord ? '' : addr
    }, coord || {});
    if (!existing) places.push(np);
    LS.set('places', places); closeSheet(); renderSaved(); MapView.refreshSaved();
    toast(existing ? '수정했어요' : '⭐ 저장했어요');
  };
}

// ---------- 카카오 지도 SDK (선택 기능) ----------
const Kakao = {
  _p: null,
  _load(key){
    return new Promise(resolve => {
      const s = document.createElement('script');
      s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${enc(key)}&libraries=services&autoload=false`;
      s.onload = () => { try{ kakao.maps.load(() => resolve(true)); }catch(e){ resolve(false); } };
      s.onerror = () => { s.remove(); resolve(false); };
      document.head.appendChild(s);
      setTimeout(() => resolve(!!(window.kakao && kakao.maps && kakao.maps.services)), 9000);
    });
  },
  ready(){
    if (!kakaoKey()) return Promise.resolve(false);
    if (this._p) return this._p;
    this._p = (async () => {
      let ok = await this._load(kakaoKey());
      // 설정에 직접 넣은 키가 틀렸으면 앱 기본 키로 한 번 더
      if (!ok && settings.kakaoKey && settings.kakaoKey !== BUILTIN_KAKAO_KEY){
        try{ delete window.kakao; }catch(e){ window.kakao = undefined; }
        ok = await this._load(BUILTIN_KAKAO_KEY);
        if (ok){ settings.kakaoKey = ''; LS.set('settings', settings); toast('설정의 카카오 키가 맞지 않아 앱 기본 키로 바꿨어요'); }
      }
      if (!ok){ toast('카카오 지도를 불러오지 못해 기본 지도로 보여드려요'); this._p = null; }
      return ok;
    })();
    return this._p;
  },
  keyword(q, opt = {}){
    return new Promise(resolve => {
      const ps = new kakao.maps.services.Places();
      ps.keywordSearch(q, (data, status, pg) => {
        Kakao._pg = pg;
        resolve(status === kakao.maps.services.Status.OK ? data : []);
      }, opt);
    });
  },
  areaName(pos){
    return new Promise(resolve => {
      const gc = new kakao.maps.services.Geocoder();
      gc.coord2RegionCode(pos.lng, pos.lat, (res, status) => {
        if (status !== kakao.maps.services.Status.OK || !res.length) return resolve('');
        const h = res.find(r => r.region_type === 'H') || res[0];
        resolve([h.region_2depth_name, h.region_3depth_name].filter(Boolean).join(' '));
      });
    });
  }
};

// ---------- 지도 엔진: 카카오맵 (불러오지 못하면 기본 지도 OpenStreetMap) ----------
// 같은 명령(가운데 옮기기, 핀 찍기, 원 그리기, 범위 맞추기)을 지도 종류별로 처리
function loadScript(src){
  return new Promise(res => { const s = document.createElement('script'); s.src = src;
    s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); });
}
const ACCENT = '#ff7a59';
const Engines = {
  kakao: {
    label: '카카오맵',
    load(){ return Kakao.ready(); },
    create(el, c){
      const m = new kakao.maps.Map(el, {center: new kakao.maps.LatLng(c.lat, c.lng), level: 5});
      m.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT); return m; },
    center(m){ const c = m.getCenter(); return {lat:c.getLat(), lng:c.getLng()}; },
    setCenter(m, c){ m.setCenter(new kakao.maps.LatLng(c.lat, c.lng)); },
    marker(m, c, html, z, onClick){
      const box = document.createElement('div'); box.innerHTML = html; const node = box.firstChild;
      if (onClick){ node.style.cursor = 'pointer'; node.addEventListener('click', onClick); }
      const o = new kakao.maps.CustomOverlay({position: new kakao.maps.LatLng(c.lat, c.lng), content: node, zIndex: z, yAnchor: .5});
      o.setMap(m); return () => o.setMap(null); },
    circle(m, c, r){
      const o = new kakao.maps.Circle({center: new kakao.maps.LatLng(c.lat, c.lng), radius: r, strokeWeight: 1.5,
        strokeColor: ACCENT, strokeOpacity: .8, fillColor: ACCENT, fillOpacity: .07});
      o.setMap(m); return () => o.setMap(null); },
    fit(m, pts){ const b = new kakao.maps.LatLngBounds(); pts.forEach(p => b.extend(new kakao.maps.LatLng(p.lat, p.lng))); m.setBounds(b); },
    relayout(m){ m.relayout(); }
  },
  osm: {
    label: '기본 지도', _p: null,
    load(){
      if (this._p) return this._p;
      const css = document.createElement('link'); css.rel = 'stylesheet';
      css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
      this._p = loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js').then(ok => ok && !!window.L);
      return this._p; },
    create(el, c){
      const m = L.map(el, {zoomControl: true}).setView([c.lat, c.lng], 15);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(m);
      return m; },
    center(m){ const c = m.getCenter(); return {lat: c.lat, lng: c.lng}; },
    setCenter(m, c){ m.setView([c.lat, c.lng], m.getZoom()); },
    marker(m, c, html, z, onClick){
      const mk = L.marker([c.lat, c.lng], {icon: L.divIcon({html, className: '', iconSize: [26, 26], iconAnchor: [13, 13]}),
        zIndexOffset: z * 100}).addTo(m);
      if (onClick) mk.on('click', onClick);
      return () => mk.remove(); },
    circle(m, c, r){ const o = L.circle([c.lat, c.lng], {radius: r, color: ACCENT, weight: 1.5, fillOpacity: .07}).addTo(m); return () => o.remove(); },
    fit(m, pts){ m.fitBounds(pts.map(p => [p.lat, p.lng]), {padding: [40, 40], maxZoom: 16}); },
    relayout(m){ m.invalidateSize(); }
  }
};

const MapView = {
  map: null, eng: null, engName: '', el: null,
  marks: [], savedMarks: [], meRm: null, circleRm: null,
  showSaved: true, results: [], themeId: '', pg: null, _busy: null,
  showPk: false, pkList: [], pkMarks: [],
  drawPk(){
    this.pkMarks.forEach(rm => rm()); this.pkMarks = [];
    if (!this.showPk || !this.map) return;
    this.pkList.forEach(p => this.pkMarks.push(this.eng.marker(this.map, p, pkPin(p), 2,
      () => openSheet(`<h2>🅿️ 주차장</h2>${pkCard(p)}${pkSourceNote()}`))));
  },
  async loadPkAround(){
    if (!this.map) return;
    const c = this.eng.center(this.map);
    $('#mapInfo').textContent = '주변 주차장을 불러오는 중…';
    try{
      this.pkList = (await PK.near(c, Math.min(Math.max(settings.radius, 1000), 5000))).slice(0, 150);
      $('#mapInfo').textContent = this.pkList.length ? `주차장 ${this.pkList.length}곳 (P 옆 숫자는 1시간 요금)` : '이 주변엔 등록된 주차장 정보가 없어요';
    }catch(e){ this.pkList = []; $('#mapInfo').textContent = '주차장 정보를 불러오지 못했어요'; }
    this.drawPk();
  },
  drawProviderUI(using){
    const note = $('#mapNote');
    if (using === 'kakao' || !using){ note.hidden = true; }
    else {
      note.hidden = false;
      note.innerHTML = `카카오맵을 불러오지 못해 <b>기본 지도</b>로 보여드려요. 잠시 뒤 다시 열어 보세요.
        <div class="hint" style="margin-top:4px">핀을 누르면 카카오맵·네이버지도 앱으로는 지금도 바로 열 수 있어요.</div>`;
    }
    $('#mapEngine').textContent = using ? Engines[using].label + (using === 'osm' ? ' (OpenStreetMap)' : '') : '';
  },
  async init(force){
    if (this._busy && !force) return this._busy;
    this._busy = this._init(force).finally(() => { this._busy = null; });
    return this._busy;
  },
  async _init(force){
    let want = kakaoKey() ? 'kakao' : 'osm';
    if (this.map && this.engName === want && !force){ this.eng.relayout(this.map, this.el); this.drawProviderUI(want); return; }
    // 이전 지도 치우기
    this.map = null; this.marks = []; this.savedMarks = []; this.pkMarks = []; this.meRm = this.circleRm = null;
    const box = $('#map'); box.innerHTML = '<div class="mapempty">지도를 불러오는 중…</div>';
    let ok = await Engines[want].load();
    if (!ok && want !== 'osm'){ toast(`${Engines[want].label}를 불러오지 못해 기본 지도로 보여드려요`); want = 'osm'; ok = await Engines.osm.load(); }
    if (!ok){ box.innerHTML = '<div class="mapempty">지도를 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.</div>'; this.drawProviderUI(''); return; }
    box.innerHTML = ''; const el = document.createElement('div'); el.style.cssText = 'position:absolute;inset:0'; box.appendChild(el);
    this.el = el; this.eng = Engines[want]; this.engName = want;
    this.map = this.eng.create(el, myPos || {lat: 37.5665, lng: 126.9780});
    this.drawProviderUI(want);
    this.drawMe(); this.refreshSaved(); this.drawPk();
    if (this.results.length) this.drawResults(false);
    if (!myPos) locate().then(p => { if (!this.map) return; this.eng.setCenter(this.map, p); this.drawMe(); }).catch(() => {});
  },
  drawMe(){
    if (!this.map || !myPos) return;
    if (this.meRm) this.meRm(); if (this.circleRm) this.circleRm();
    this.circleRm = this.eng.circle(this.map, myPos, settings.radius);
    this.meRm = this.eng.marker(this.map, myPos, '<div class="mk me"></div>', 1);
  },
  refreshSaved(){
    if (!this.map) return;
    this.savedMarks.forEach(rm => rm()); this.savedMarks = [];
    if (!this.showSaved) return;
    places.filter(p => p.lat).forEach(p => {
      this.savedMarks.push(this.eng.marker(this.map, p,
        `<div class="mk saved" style="--c:${esc(themeColor(themeOf(p.theme)))}">★</div>`, 3,
        () => { openSheet(placeCard(p, {noEdit: true})); fillPhotos($('#sheet')); }));
    });
  },
  resColor(){ const c = themeColor(themeOf(this.themeId)); return c === '#8a99a8' ? ACCENT : c; },
  drawResults(fit){
    this.marks.forEach(rm => rm()); this.marks = [];
    this.results.forEach((r, i) => {
      const c = {lat: +r.y, lng: +r.x};
      this.marks.push(this.eng.marker(this.map, c, `<div class="mk" style="--c:${esc(this.resColor())}">${i + 1}</div>`, 2,
        () => this.openResult(i)));
    });
    if (fit && this.results.length) this.eng.fit(this.map, this.results.map(r => ({lat: +r.y, lng: +r.x})));
  },
  resultPlace(r){ return {name: r.place_name, address: r.road_address_name || r.address_name, lat: +r.y, lng: +r.x,
    kakaoUrl: r.place_url, phone: r.phone, category: (r.category_name || '').split(' > ').pop()}; },
  // 핀을 누르면: 네이버지도 / 카카오맵 고르기
  openResult(i){
    const r = this.results[i], p = this.resultPlace(r);
    const saved = places.some(x => x.kakaoUrl === r.place_url);
    openSheet(`
      <h2>${esc(p.name)}</h2>
      <div class="q">${esc(p.category)} · ${esc(p.address)}${r.distance ? ' · ' + fmtDist(r.distance / 1000) : ''}${p.phone ? ' · ' + esc(p.phone) : ''}</div>
      <div class="label" style="margin-top:0">어느 지도로 볼까요?</div>
      <div class="bigbtns">
        <a class="lnk naver" href="${esc(Links.naverSearch(placeQuery(p)))}" target="_blank" rel="noopener">N 네이버지도</a>
        <a class="lnk kakao" href="${esc(r.place_url)}" target="_blank" rel="noopener">K 카카오맵</a>
      </div>
      <div class="actions">
        <a class="lnk plain" href="${esc(Links.kakaoRoute(p))}" target="_blank" rel="noopener">🚗 길찾기</a>
        <button class="lnk plain" id="resSave">${saved ? '⭐ 저장됨' : '☆ 내 명소에 저장'}</button>
      </div>`);
    $('#resSave').onclick = () => {
      if (saved) return toast('이미 저장한 곳이에요');
      openPlaceForm(null, this.themeId, p);
    };
  },
  async search(themeId){

// ---------- 주차장 (공공데이터포털 전국주차장정보표준데이터, tools/build_parking.py 로 만든 parking/*.json) ----------
const PK = {
  idx: null, cache: {},
  async index(){
    if (!this.idx){ const r = await fetch('parking/index.json'); if (!r.ok) throw new Error('no index'); this.idx = await r.json(); }
    return this.idx;
  },
  async tile(k){
    if (this.cache[k]) return this.cache[k];
    const idx = await this.index();
    if (!idx.tiles.includes(k)) return (this.cache[k] = []);
    const r = await fetch('parking/' + k + '.json');
    return (this.cache[k] = r.ok ? await r.json() : []);
  },
  // c 중심 radiusM 미터 안의 주차장 (가까운 순)
  async near(c, radiusM){
    const T = (await this.index()).tile;
    const dLat = radiusM / 111000, dLng = radiusM / (111000 * Math.cos(c.lat * Math.PI / 180));
    const keys = [];
    for (let a = Math.floor((c.lat - dLat) / T); a <= Math.floor((c.lat + dLat) / T); a++)
      for (let b = Math.floor((c.lng - dLng) / T); b <= Math.floor((c.lng + dLng) / T); b++) keys.push(a + '_' + b);
    const rows = (await Promise.all(keys.map(k => this.tile(k)))).flat();
    return rows.map(pkObj).map(p => (p.dist = distKm(c, p) * 1000, p))
      .filter(p => p.dist <= radiusM).sort((x, y) => x.dist - y.dist);
  }
};
function pkObj(r){
  return {name:r[0], kind:r[1], type:r[2], addr:r[3], lots:r[4], days:r[5], wk:r[6], sa:r[7], ho:r[8], fee:r[9],
    bm:r[10], bf:r[11], am:r[12], af:r[13], day:r[14], mon:r[15], pay:r[16], note:r[17], org:r[18], tel:r[19],
    lat:r[20], lng:r[21], date:r[22]};
}
const won = n => Number(n).toLocaleString('ko-KR') + '원';
// 1시간 주차 요금 (0 = 무료, null = 계산할 정보 없음, -1 = 값이 이상해서 확인 필요)
function pkHour(p){
  if (p.fee === '무료') return 0;
  if (p.bf == null || p.bm == null || p.bm <= 0) return null;
  if (p.bf === 0 && !p.af) return null;          // 유료인데 금액 0 → 정보 누락으로 봄
  let fee;
  if (p.bm >= 60) fee = p.bf;
  else if (p.am > 0 && p.af != null) fee = p.bf + Math.ceil((60 - p.bm) / p.am) * p.af;
  else return null;
  if (p.day > 0 && fee > p.day) fee = p.day;     // 1일 주차권보다 비싸지 않게
  if (fee > 15000) return -1;                    // 1시간 1만5천원 초과는 입력 오류일 가능성이 커서 '확인 필요'
  return fee;
}
function pkFeeDetail(p){
  if (p.fee === '무료') return '무료 주차장';
  const a = [];
  if (p.bm != null && p.bf != null && !(p.bf === 0 && !p.af)) a.push(`기본 ${p.bm}분 ${won(p.bf)}`);
  if (p.am > 0 && p.af != null) a.push(`추가 ${p.am}분당 ${won(p.af)}`);
  if (p.day > 0) a.push(`1일 ${won(p.day)}`);
  if (p.mon > 0) a.push(`월정기 ${won(p.mon)}`);
  return a.length ? a.join(' · ') : '요금 금액이 등록되지 않았어요';
}
function pkToday(p){
  const d = new Date().getDay();
  const h = d === 0 ? p.ho : d === 6 ? p.sa : p.wk;
  if (!h) return '';
  if (/^00:00-(23:59|24:00|00:00)$/.test(h)) return '24시간';
  return h.replace('-', '~');
}
function pkPin(p){
  const h = pkHour(p);
  const lbl = h === 0 ? '무료' : (h == null || h < 0) ? '' : (h >= 10000 ? (h / 10000).toFixed(1).replace('.0','') + '만' : h.toLocaleString('ko-KR'));
  return `<div class="mk pk ${h === 0 ? 'free' : ''}">P${lbl ? ' ' + lbl : ''}</div>`;
}
function pkCard(p){
  const h = pkHour(p), today = pkToday(p);
  const fee = h === 0 ? '<span class="free">무료</span>' : h === -1 ? '<span class="unk">요금 확인 필요 (등록된 값이 이상해요)</span>' : h == null ? '<span class="unk">요금 정보 없음' + (p.fee ? ' (' + esc(p.fee) + ')' : '') + ' · 현장·카카오맵에서 확인</span>' : `1시간 <b>${won(h)}</b>`;
  const pos = {name: p.name, lat: p.lat, lng: p.lng};
  return `<div class="card pkc ${h === 0 ? 'free' : ''}">
    <div class="top"><h3>${esc(p.name)}</h3>${p.dist != null ? `<span class="dist">${fmtDist(p.dist / 1000)}</span>` : ''}</div>
    <div><span class="badge" style="--c:#2563eb">${esc(p.kind || '')}${p.type ? '·' + esc(p.type) : ''}</span>${p.lots ? `<span class="meta">${p.lots}면</span>` : ''}</div>
    <div class="pkfee">${fee}</div>
    ${h == null && p.fee !== '혼합' ? '' : `<div class="meta">${esc(pkFeeDetail(p))}</div>`}
    <div class="meta">${today ? '오늘 ' + esc(today) + ' · ' : ''}${esc(p.addr || '')}</div>
    ${p.note ? `<div class="meta">ℹ️ ${esc(p.note)}</div>` : ''}
    <div class="actions">
      <a class="lnk kakao" href="${esc(Links.kakaoPlace(pos))}" target="_blank" rel="noopener">카카오맵</a>
      <a class="lnk plain" href="${esc(Links.kakaoRoute(pos))}" target="_blank" rel="noopener">🚗 길찾기</a>
      <a class="lnk naver" href="${esc(Links.naverSearch(p.name + ' ' + (p.addr || '').split(' ').slice(1,3).join(' ')))}" target="_blank" rel="noopener">네이버</a>
      ${p.tel && !/^0{2,3}-0{3,4}-0{4}$/.test(p.tel) ? `<span class="meta" style="align-self:center">☎ ${esc(p.tel)}</span>` : ''}
    </div></div>`;
}
function pkSourceNote(){
  const d = PK.idx && PK.idx.latest ? ` (최신 기준일 ${PK.idx.latest})` : '';
  return `<p class="hint">출처: 공공데이터포털 전국주차장정보표준데이터${d}. 지자체가 올린 정보라 실제 요금·운영시간과 다를 수 있어요. 1시간 요금은 기본·추가 요금으로 계산한 값이에요.</p>`;
}

let pkFilter = 'all', pkSort = 'dist';
async function openParkingSheet(){
  openSheet(`<h2>🅿️ 주변 주차장</h2><div class="q" id="pkWhere">위치 확인 중…</div><div id="pkBody"><div class="empty">불러오는 중…</div></div>`);
  let c = null, where = '';
  const area = currentArea();
  try{
    if (!useMyLoc && area){
      if (await Kakao.ready()){ const r = await Kakao.keyword(area, {size: 1}); if (r[0]){ c = {lat: +r[0].y, lng: +r[0].x}; where = area; } }
    }
    if (!c){ c = myPos || await locate(); where = myArea || '현재 위치'; }
  }catch(e){ $('#pkBody').innerHTML = `<div class="empty">${esc(e.message)}<br>지역을 입력하거나 위치를 켜 주세요.</div>`; $('#pkWhere').textContent = ''; return; }
  let radius = settings.radius, list = [];
  try{
    list = await PK.near(c, radius);
    if (list.length < 3 && radius < 3000){ radius = 3000; list = await PK.near(c, radius); }
  }catch(e){ $('#pkBody').innerHTML = '<div class="empty">주차장 정보를 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요.</div>'; return; }
  const rLabel = radius >= 1000 ? (radius / 1000) + 'km' : radius + 'm';
  $('#pkWhere').textContent = `📍 ${where} 기준 · 반경 ${rLabel} · ${list.length}곳`;
  const draw = () => {
    let l = list.slice();
    if (pkFilter === 'free') l = l.filter(p => pkHour(p) === 0);
    if (pkFilter === 'public') l = l.filter(p => p.kind === '공영');
    const fv = p => { const h = pkHour(p); return h == null || h < 0 ? 1e9 : h; };
    if (pkSort === 'fee') l.sort((a, b) => fv(a) - fv(b) || a.dist - b.dist);
    const chip = (k, v, label, cur) => `<button class="chip ${cur === v ? 'on' : ''}" data-${k}="${v}">${label}</button>`;
    $('#pkBody').innerHTML = `
      <div class="chips" style="margin:0 0 6px">${chip('pf','all','전체',pkFilter)}${chip('pf','free','무료만',pkFilter)}${chip('pf','public','공영만',pkFilter)}
        <span style="flex:1"></span>${chip('ps','dist','가까운순',pkSort)}${chip('ps','fee','1시간 요금순',pkSort)}</div>
      ${list.length ? `<button class="btn primary" id="pkMap" style="width:100%;margin:6px 0 10px">🗺️ 지도에서 보기</button>` : ''}
      ${l.length ? l.slice(0, 40).map(pkCard).join('') : '<div class="empty">조건에 맞는 주차장이 없어요.</div>'}
      ${l.length > 40 ? `<p class="hint">가까운 40곳만 보여드려요. 반경을 줄이면 더 정확해요.</p>` : ''}
      ${pkSourceNote()}`;
    $('#pkBody').querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { pkFilter = b.dataset.pf; draw(); });
    $('#pkBody').querySelectorAll('[data-ps]').forEach(b => b.onclick = () => { pkSort = b.dataset.ps; draw(); });
    const pm = $('#pkMap');
    if (pm) pm.onclick = async () => {
      closeSheet(); showTab('map'); await MapView.init();
      MapView.showPk = true; drawPkBtn(); MapView.pkList = list.slice(0, 150); MapView.drawPk();
      if (MapView.map){ const pts = MapView.pkList.concat([c]); MapView.eng.fit(MapView.map, pts); }
      $('#mapInfo').textContent = `주차장 ${MapView.pkList.length}곳 (P 옆 숫자는 1시간 요금)`;
    };
  };
  draw();
}

      <div class="kpi"><div class="k">📍 반경 ${rLabel} 안</div>
        <div class="v">${myPos ? inR.length : '–'}<small>곳</small></div>
        <div class="s">${myPos ? esc(myArea || '현재 위치') + ' 기준' : '위치를 켜면 보여요'}</div></div>
      <div class="kpi"><div class="k">🏁 가장 가까운 곳</div>
        <div class="v" style="font-size:20px;padding:4px 0 3px">${near.length ? fmtDist(distKm(myPos, near[0])) : '–'}</div>
        <div class="s">${near.length ? esc(near[0].name) : (withPos.length ? '위치를 켜면 보여요' : '위치 저장된 곳 없음')}</div></div>
      <div class="kpi"><div class="k">⭐ 내 평균 별점</div>
        <div class="v">${rated.length ? fmtRate(avg) : '–'}<small>/ 5</small></div>
        <div class="s">${rated.length ? starsHTML(Math.round(avg*2)/2) : '가본 곳에 별점을 남겨 보세요'}</div></div>
      <div class="kpi"><div class="k">📝 후기 · 📷 사진</div>
        <div class="v">${reviews}<small>개</small> <span style="font-size:18px;color:var(--sub)">·</span> ${photoN}<small>장</small></div>
        <div class="s">가본 곳 ${visited}곳 기록</div></div>
    </div>

    ${best.length ? `<div class="label">내 베스트 명소 <button data-goto="saved" data-sort="rate">별점순 보기</button></div>
    <div class="card" style="padding:4px 14px">${best.map(p => { const t = themeOf(p.theme);
      return `<a class="mini" href="${esc(Links.kakaoPlace(p))}" target="_blank" rel="noopener" style="--c:${esc(themeColor(t))}">
        <span class="dot">${(p.photos||[]).length ? `<img data-ph="${esc(p.photos[0])}" alt="" style="width:34px;height:34px;border-radius:11px;object-fit:cover">` : (t ? esc(t.em) : '📍')}</span>
        <span class="tx"><b>${esc(p.name)}</b><span>${starsHTML(p.rating)} ${fmtRate(p.rating)}${p.review ? ' · ' + esc(p.review.slice(0,24)) + (p.review.length > 24 ? '…' : '') : ''}</span></span>
      </a>`; }).join('')}</div>` : ''}


    <div class="label">테마별 저장 현황</div>
    <div class="card bars">${rows.length ? rows.map(([id,n]) => { const t = themeOf(id);
      return `<div class="bar" style="--c:${esc(themeColor(t))}"><span class="n">${t ? esc(t.em+' '+t.name) : '📍 기타'}</span>
        <span class="track"><i style="width:${Math.max(6, n/max*100)}%"></i></span><span class="cnt">${n}</span></div>`; }).join('')
      : `<div class="empty" style="padding:18px 8px">아직 저장한 명소가 없어요.<br>테마를 눌러 찾아보고 저장해 보세요.</div>`}</div>

    <div class="label">${listTitle} <button data-goto="saved">전체 보기</button></div>
    <div class="card" style="padding:4px 14px">${listItems.length ? listItems.join('')
      : `<div class="empty" style="padding:18px 8px">저장한 명소가 여기에 보여요.</div>`}</div>
    `}
  `;
}
// ---------- 대시보드 미니 지도 ----------
const DashMap = {
  map: null, eng: null, marks: [], _busy: null,
  async init(){
    if (this.map) return true;
    if (this._busy) return this._busy;
    this._busy = (async () => {
      let name = kakaoKey() ? 'kakao' : 'osm';
      let ok = await Engines[name].load();
      if (!ok && name !== 'osm'){ name = 'osm'; ok = await Engines.osm.load(); }
      const box = $('#dashMap');
      if (!ok){ box.innerHTML = '<div class="mapempty">지도를 불러오지 못했어요</div>'; return false; }
      box.innerHTML = ''; const el = document.createElement('div'); el.style.cssText = 'position:absolute;inset:0'; box.appendChild(el);
      this.eng = Engines[name];
      this.map = this.eng.create(el, myPos || {lat: 37.5665, lng: 126.9780});
      return true;
    })().finally(() => { this._busy = null; });
    return this._busy;
  },
  async refresh(){
    if (!$('#v-dash').classList.contains('on')) return;
    if (!await this.init()) return;
    const m = this.map, eng = this.eng;
    eng.relayout(m);
    this.marks.forEach(rm => rm()); this.marks = [];
    const pts = places.filter(p => p.lat);
    pts.forEach(p => this.marks.push(eng.marker(m, p,
      `<div class="mk saved" style="--c:${esc(themeColor(themeOf(p.theme)))}">★</div>`, 3,
      () => { openSheet(placeCard(p)); fillPhotos($('#sheet')); })));
    const rLabel = (RADII.find(x => x[0] === settings.radius) || [0,''])[1];
    if (myPos){
      this.marks.push(eng.circle(m, myPos, settings.radius));
      this.marks.push(eng.marker(m, myPos, '<div class="mk me"></div>', 1));
      // 반경 원이 꽉 차게 보이도록
      const dLat = settings.radius / 111000, dLng = settings.radius / (111000 * Math.cos(myPos.lat * Math.PI / 180));
      eng.fit(m, [{lat: myPos.lat - dLat, lng: myPos.lng - dLng}, {lat: myPos.lat + dLat, lng: myPos.lng + dLng}]);
      const inR = pts.filter(p => distKm(myPos, p) * 1000 <= settings.radius).length;
      $('#dashMapCap').textContent = `📍 ${myArea || '내 주변'} · 반경 ${rLabel} · ★ ${inR}곳`;
    } else if (pts.length){
      eng.fit(m, pts);
      $('#dashMapCap').textContent = `★ 저장한 명소 ${pts.length}곳`;
    } else {
      $('#dashMapCap').textContent = '위치를 켜면 내 주변이 보여요';
    }
  }
};
$('#dashMapOpen').addEventListener('click', () => showTab('map'));

const _renderDash = renderDash;
renderDash = function(){ _renderDash(); fillPhotos($('#dash')); DashMap.refresh(); };
let dashCat = 'all';   // 앱을 열면 항상 '전체'로 시작
let dashCuOpen = false;   // '무엇을 먹을까요?' 펼침 여부 (방송 맛집을 눌렀을 때만 나오고, 처음엔 첫 줄만)
$('#dash').addEventListener('click', e => {
  const st = e.target.closest('[data-start]');
  if (st){
    if (st.dataset.start === 'parking') return openParkingSheet();
    dashCat = 'food'; dashCuOpen = true; _renderDash(); fillPhotos($('#dash'));
    const g = $('#dash .cuis'); if (g) g.scrollIntoView({behavior: 'smooth', block: 'center'});
    return;
  }
  const bk = e.target.closest('[data-backup]');
  if (bk){ if (bk.dataset.backup === 'later'){ LS.set('backupSnooze', Date.now()); renderDash(); } else exportBackup(); return; }
  if (e.target.closest('[data-cuexp]')){ dashCuOpen = !dashCuOpen; _renderDash(); fillPhotos($('#dash')); return; }
  const dc = e.target.closest('[data-dc]');
  if (dc){ dashCat = dc.dataset.dc; dashCuOpen = false; _renderDash(); fillPhotos($('#dash')); return; }
  const q = e.target.closest('[data-q]'); if (q) return openSearchSheet(themes[+q.dataset.q]);
  const g = e.target.closest('[data-goto]');
  if (g){ if (g.dataset.sort) $('#savedSort').value = g.dataset.sort; return showTab(g.dataset.goto); }
});

// ---------- 백업 ----------
async function exportBackup(){
  const photoData = {};
  for (const p of places) for (const id of (p.photos || [])){ try{ const d = await PhotoDB.get(id); if (d) photoData[id] = d; }catch(e){} }
  const blob = new Blob([JSON.stringify({app:'myeongso', v:2, exportedAt:new Date().toISOString(), themes, places, recents, photos:photoData})], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `자두_백업_${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  LS.set('lastBackup', Date.now()); toast('💾 백업 파일을 받았어요 (다운로드 폴더)');
  if ($('#v-dash').classList.contains('on')) renderDash();
}
// 저장한 곳이 3곳 이상인데 30일 넘게 백업을 안 했으면 대시보드에 알림 (나중에 → 7일 뒤 다시)
function backupNag(total){
  const DAY = 864e5, last = LS.get('lastBackup', 0), snooze = LS.get('backupSnooze', 0);
  if (total < 3 || Date.now() - last < 30 * DAY || Date.now() - snooze < 7 * DAY) return '';
  return `<div class="card nag"><div>💾 저장한 <b>${total}곳</b>과 후기·사진은 이 휴대폰에만 있어요. 폰을 바꾸기 전에 백업해 두세요.</div>
    <div class="row" style="gap:6px;margin-top:8px"><button class="btn small primary" data-backup="now">백업 받기</button><button class="btn small ghost" data-backup="later">나중에</button></div></div>`;
}

// ---------- 새 버전 알림 ----------
async function doUpdate(){
  toast('최신 버전을 불러오는 중…');
  try{
    if ('serviceWorker' in navigator){ for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); }
    if (window.caches){ for (const k of await caches.keys()) await caches.delete(k); }
  }catch(e){}
  location.replace(location.pathname + '?v=' + Date.now());
}
let lastUpdateCheck = 0;
async function checkUpdate(){
  if (Date.now() - lastUpdateCheck < 10 * 60e3) return;
  lastUpdateCheck = Date.now();
  try{
    const t = await (await fetch('index.html?check=' + Date.now(), {cache: 'no-store'})).text();
    const m = t.match(/const APP_VER = '([^']+)'/);
    if (m && m[1] !== APP_VER && !$('#updBar')){
      const bar = document.createElement('div'); bar.id = 'updBar'; bar.className = 'updbar';
      bar.innerHTML = `<span>🍑 새 버전이 나왔어요</span><button class="btn small primary">지금 업데이트</button><button class="x" aria-label="닫기">✕</button>`;
      bar.querySelector('.btn').onclick = doUpdate;
      bar.querySelector('.x').onclick = () => bar.remove();
      document.body.appendChild(bar);
    }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

// ---------- 탭 ----------
function showTab(name){
  if (name !== 'dash') ensureGuard();
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-'+name));
  if (name === 'map') MapView.init();
  if (name === 'saved') renderSaved();
  if (name === 'dash') renderDash();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

// ---------- 설정 / 백업 ----------
function openSettings(){
  openSheet(`
    <h2>⚙️ 설정</h2>
    <div class="card" style="margin:10px 0 4px;padding:12px 14px;box-shadow:none;background:var(--card2)">
      <div style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" alt="" style="width:40px;height:40px;border-radius:11px">
        <div style="font-weight:800;font-size:15px">자두 = <span style="color:var(--accent)">자</span>주 가는 곳을 <span style="color:var(--accent)">두</span>다</div></div>
      <div class="hint" style="margin-top:6px">‘당근’이 ‘당신 근처’의 줄임말인 것처럼, ‘자두’는 ‘자주 가는 곳을 두다’의 줄임말이에요.
        가고 싶은 곳을 <b>찾고</b> → 내 목록에 <b>두고</b> → <b>길찾기로 이동</b>까지 한 번에 이어 드려요.</div>
    </div>
    <div class="field" style="margin-top:12px"><label>화면 모드</label>
      <div class="seg" id="sTheme">
        <button data-t="light" class="${settings.mode==='light'?'on':''}">☀️ 라이트</button>
        <button data-t="dark" class="${settings.mode==='dark'?'on':''}">🌙 다크</button>
        <button data-t="auto" class="${settings.mode==='auto'?'on':''}">자동</button>
      </div></div>
    <div class="field"><label>링크 열기 방식</label>
      <div class="seg" id="sMode">
        <button data-m="web" class="${settings.openMode==='web'?'on':''}">웹으로 열기</button>
        <button data-m="app" class="${settings.openMode==='app'?'on':''}">지도 앱으로 열기</button>
      </div>
      <div class="hint" style="margin-top:5px">‘지도 앱으로 열기’는 휴대폰에 네이버지도·카카오맵 앱이 설치돼 있어야 해요.</div></div>
    <div class="field"><label><span class="pl k" style="display:inline-grid;margin-right:4px">K</span>카카오 JavaScript 키 (선택)</label>
      <input class="input" id="sKey" value="${esc(settings.kakaoKey)}" placeholder="비워두면 앱 기본 키 사용" autocomplete="off">
      <div class="hint" style="margin-top:5px">카카오맵 화면, 앱 안 장소 검색, 동 이름 자동 표시, 장소 위치 저장이 켜져요.</div></div>
    <button class="btn primary" id="sSave" style="width:100%">설정 저장</button>
    <hr>
    <div class="label" style="margin-top:0">데이터 백업 (저장 장소·테마)</div>
    <p class="hint" style="margin-top:0">별점·후기·사진도 함께 백업돼요. 데이터는 이 휴대폰 브라우저 안에만 저장돼요. 폰을 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 받아 두세요.</p>
    <div class="row">
      <button class="btn ghost" id="sExport" style="flex:1">⬇️ 백업 받기</button>
      <button class="btn ghost" id="sImport" style="flex:1">⬆️ 백업 불러오기</button>
    </div>
    <input type="file" id="sFile" accept="application/json,.json" hidden>
    <button class="btn ghost" id="sResetThemes" style="width:100%;margin-top:8px">테마를 기본값으로 되돌리기</button>
    <hr>
    <div class="label" style="margin-top:0">앱 버전 <span style="font-weight:400">${APP_VER}</span></div>
    <p class="hint" style="margin-top:0">새 기능이 안 보이면 눌러 주세요. 저장한 장소·후기·사진은 지워지지 않아요.</p>
    <button class="btn primary" id="sUpdate" style="width:100%">🔄 최신 버전으로 새로고침</button>
  `);
  let mode = settings.openMode;
  $('#sTheme').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return;
    settings.mode = b.dataset.t; LS.set('settings', settings); applyMode();
    $('#sTheme').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#sMode').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; mode = b.dataset.m;
    $('#sMode').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  $('#sSave').onclick = () => {
    const newKey = $('#sKey').value.trim();
    const keyChanged = newKey !== settings.kakaoKey;
    settings.openMode = mode; settings.kakaoKey = newKey; LS.set('settings', settings);
    closeSheet(); toast('설정을 저장했어요');
    if (keyChanged) setTimeout(() => location.reload(), 500);   // 새 키로 지도 다시 불러오기
  };
  $('#sExport').onclick = () => exportBackup();
  $('#sImport').onclick = () => $('#sFile').click();
  $('#sFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try{
      const d = JSON.parse(await f.text());
      if (!Array.isArray(d.places) || !Array.isArray(d.themes)) throw 0;
      if (!confirm(`장소 ${d.places.length}곳, 테마 ${d.themes.length}개를 불러올까요?\n(같은 장소는 건너뛰고 합쳐요)`)) return;
      const ids = new Set(places.map(p => p.id));
      places = places.concat(d.places.filter(p => !ids.has(p.id)));
      const tids = new Set(themes.map(t => t.id));
      themes = themes.concat(d.themes.filter(t => !tids.has(t.id)));
      for (const [id, data] of Object.entries(d.photos || {})){ try{ await PhotoDB.put(id, data); }catch(e){} }
      LS.set('places', places); LS.set('themes', themes);
      closeSheet(); renderThemes(); renderSaved(); renderDash(); toast('백업을 불러왔어요');
    }catch(err){ toast('백업 파일 형식이 아니에요'); }

  $('#sResetThemes').onclick = () => {
    if (!confirm('테마를 기본값으로 되돌릴까요? (저장 장소는 그대로)')) return;
    themes = DEFAULT_THEMES.slice(); LS.set('themes', themes); closeSheet(); renderThemes(); renderSaved();

}
$('#btnSettings').addEventListener('click', openSettings);

$('#findCuis').innerHTML = cuisineGrid();
renderThemes(); renderRegionChips(); renderSaved(); renderDash();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}   // 브라우저가 저장 데이터를 임의로 지우지 않게 요청
setTimeout(checkUpdate, 4000);
ensureGuard();   // 첫 화면에서도 뒤로 가기가 바로 종료되지 않도록
if (!LS.get('onboarded', false) && !places.length){
  // 처음 연 사람에게 한 번만: 이름 뜻과 쓰는 법 → '시작하기'를 누르면 위치 확인
  openSheet(`
    <div style="text-align:center;padding:6px 0 2px"><img src="icon-192.png" alt="" style="width:76px;height:76px;border-radius:20px"></div>
    <h2 style="text-align:center;margin-top:8px">자두에 오신 걸 환영해요</h2>
    <p class="q" style="text-align:center"><b style="color:var(--accent)">자</b>주 가는 곳을 <b style="color:var(--accent)">두</b>다 — 가고 싶은 곳을 찾고, 내 목록에 두고, 바로 이동해요</p>
    <ol class="steps" style="margin:6px 0 12px">
      <li><b>찾기</b> 방송 맛집·음식 종류·빵집·카페·주차장을 내 주변에서 찾아요</li>
      <li><b>두기</b> ☆ 저장으로 내 목록에 담고, 가 본 곳엔 별점·후기·사진을 남겨요</li>

  let started = false;

  $('#obStart').onclick = start;
  $('#dim').addEventListener('click', start, {once: true});
  window.addEventListener('popstate', start, {once: true});
} else {

  useCurrentLocation(true);   // 앱을 열면 바로 내 위치 기준으로 시작
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
